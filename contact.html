<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Portfolio</title>
  <meta name="description" content="Get in touch via contact form or direct channels.">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Global Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">PORTFOLIO<span>.</span></a>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/projects.html">Projects & Awards</a></li>
          <li><a href="/contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="container" style="padding-block: 4rem;">
    
    <section style="max-width: 700px;">
      <div class="section-header">
        <span class="section-tag">Get in Touch</span>
        <h1 class="section-title">Contact Information</h1>
      </div>
      
      <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem;">
        [Placeholder for your direct contact info: Email, LinkedIn, GitHub, Location, Resume link, etc.]
      </p>

      <!-- Contact Form Placeholder -->
      <form id="contact-form" style="background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: var(--radius);">
        <div style="margin-bottom: 1.25rem;">
          <label for="name" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font: inherit;">
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font: inherit;">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="message" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font: inherit; resize: vertical;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </section>

  </main>

  <!-- Global Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Portfolio. Built & hosted on Cloudflare Pages.</p>
      <nav aria-label="Footer Navigation">
        <ul style="display: flex; gap: 1.5rem;">
          <li><a href="/">Home</a></li>
          <li><a href="/projects.html">Projects & Awards</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
